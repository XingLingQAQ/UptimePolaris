# 发布说明由提交信息生成，按 Conventional Commits 分组。
# Release notes are generated from commit messages, grouped by Conventional Commits type.

[changelog]
header = ""
body = """
## {{ version }} - {{ timestamp | date(format="%Y-%m-%d") }}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim }}{% if commit.scope %} ({{ commit.scope }}){% endif %}
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
# 不拆提交正文：多行正文会被当成多条提交，导致同一条标题重复出现。
# Do not split commit bodies: a multi-line body becomes several entries with the same title.
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Tests" },
  { message = "^ci", group = "Build and CI" },
  { message = "^style", group = "Style" },
  { message = "^revert", group = "Reverts" },
  # 版本号提交本身不进说明。
  # The version bump is not itself a change worth listing.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
]
