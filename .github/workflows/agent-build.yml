name: Agent integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/polaris-agent-target
      AGENT_NATIVE_BINARY: ${{ runner.temp }}/polaris-agent-target/debug/polaris-agent.exe
      AGENT_RUNTIME_TEST_BIN: ${{ runner.temp }}/polaris-agent-target/debug/polaris-agent.exe
      UPTIME_AGENT_NATIVE_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: XingLingQAQ/polaris-agent
          path: agent
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo build --locked --manifest-path agent/Cargo.toml
      - run: npm run test:agent-native
      - run: npm run test:agent-runtime-native
